<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리집 가계부</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가계부">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 장부(ledger) 느낌의 테두리 표 중심. 모바일은 하단 탭, 넓은 화면은 왼쪽 메뉴 + 2단 카드 */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface2:#F6F8FB; --ink:#16212E; --muted:#556375; --faint:#8A97A6;
  --line:#C3CCD7; --line-strong:#8E9BAA; --head:#22344A; --head-ink:#FFFFFF;
  --accent:#2B66A8; --accent-ink:#FFFFFF; --accent-soft:#E2ECF7;
  --pteal:#2A8C8C; --income:#1D7550; --expense:#B03F2C; --save:#2B66A8; --event:#C98A3A; --repay:#6B5BA6;
  --auto-bg:#E5EDF7; --auto-ink:#24497A; --warn:#9A5B00; --warn-bg:#FFF2D6; --bad:#B42318; --bad-bg:#FDECEA; --ok:#1D7550; --ok-bg:#E3F3EA;
  --field:#FFFDF5; --total:#DCE4EE; --hl:#FFF4C9;
  --who-a-bg:#DDEFF3; --who-a:#165C6E; --who-b-bg:#F7E4EE; --who-b:#8A2F5E; --who-j-bg:#ECEAF3; --who-j:#4E4A66;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151C; --surface:#18212B; --surface2:#1E2834; --ink:#E6ECF2; --muted:#A3B0BE; --faint:#77879A;
  --line:#34424F; --line-strong:#56677A; --head:#2C4058; --head-ink:#F2F6FA;
  --accent:#6FA6E6; --accent-ink:#0F151C; --accent-soft:#1F3247;
  --pteal:#5CC2C2; --income:#55C493; --expense:#F08472; --save:#6FA6E6; --event:#E3AE62; --repay:#A796E0;
  --auto-bg:#1F3247; --auto-ink:#B8D3F2; --warn:#F2B654; --warn-bg:#3A2E12; --bad:#FF8A7A; --bad-bg:#3D1E1A; --ok:#55C493; --ok-bg:#16352A;
  --field:#141C25; --total:#25374B; --hl:#3A3415; --who-a-bg:#173A44; --who-a:#9FD8E6; --who-b-bg:#43203A; --who-b:#F2B6D3; --who-j-bg:#2C2A3A; --who-j:#C9C4E0; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F151C; --surface:#18212B; --surface2:#1E2834; --ink:#E6ECF2; --muted:#A3B0BE; --faint:#77879A;
  --line:#34424F; --line-strong:#56677A; --head:#2C4058; --head-ink:#F2F6FA;
  --accent:#6FA6E6; --accent-ink:#0F151C; --accent-soft:#1F3247;
  --pteal:#5CC2C2; --income:#55C493; --expense:#F08472; --save:#6FA6E6; --event:#E3AE62; --repay:#A796E0;
  --auto-bg:#1F3247; --auto-ink:#B8D3F2; --warn:#F2B654; --warn-bg:#3A2E12; --bad:#FF8A7A; --bad-bg:#3D1E1A; --ok:#55C493; --ok-bg:#16352A;
  --field:#141C25; --total:#25374B; --hl:#3A3415; --who-a-bg:#173A44; --who-a:#9FD8E6; --who-b-bg:#43203A; --who-b:#F2B6D3; --who-j-bg:#2C2A3A; --who-j:#C9C4E0; color-scheme:dark;}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
.num,.tbl td.n,.tbl th.n{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-num);font-variant-numeric:tabular-nums}
a{color:var(--accent)}
a.btn{text-decoration:none}
main:focus{outline:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* shell */
.app{display:grid;grid-template-columns:1fr;min-height:100%}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1240px;margin:0 auto}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand .dot{width:10px;height:10px;border-radius:2px;background:var(--accent);display:inline-block}
.monthnav{display:flex;align-items:center;gap:4px;margin-left:auto}
.monthnav button{width:36px;height:36px;border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;cursor:pointer;font-size:16px}
.monthnav button:disabled{opacity:.35;cursor:not-allowed}
.monthnav .m{font-weight:700;font-size:16px;min-width:116px;text-align:center;padding:4px 8px;border:1px solid var(--line-strong);border-radius:6px;background:var(--field);cursor:pointer}
.monthnav input[type=month]{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 110px;max-width:1240px;width:100%;margin:0 auto;min-width:0}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600}
.nav a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.nav a[aria-current="page"]{color:var(--accent)}
.nav a.add-btn span.pill{background:var(--accent);color:var(--accent-ink);border-radius:999px;width:44px;height:30px;display:grid;place-items:center}
.nav a.add-btn span.pill svg{stroke:var(--accent-ink)}
.nav .desk-only{display:none}
@media (min-width:960px){
  .app{grid-template-columns:210px 1fr}
  .topbar{grid-column:1/-1}
  .nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);align-self:start;display:flex;flex-direction:column;border-top:0;border-right:1px solid var(--line);height:calc(100vh - 58px);padding:14px 10px;gap:2px;background:var(--surface)}
  .nav a{flex-direction:row;gap:10px;font-size:14.5px;padding:10px 12px;border-radius:6px;justify-content:flex-start}
  .nav a[aria-current="page"]{background:var(--accent-soft)}
  .nav a.add-btn span.pill{width:auto;height:auto;background:none;color:inherit}
  .nav a.add-btn span.pill svg{stroke:currentColor}
  .nav .desk-only{display:flex}
  .nav .mob-only{display:none}
  main{padding-bottom:40px}
}

/* type */
h1{font-size:22px;margin:4px 0 4px;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:16.5px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:13.5px;margin:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.grid2{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:1100px){.grid2{grid-template-columns:1fr 1fr}.grid2>*{min-width:0}}

/* card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.card-b{padding:14px}
.card-b.flush{padding:0}

/* tables: 모든 셀 테두리 */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th,.tbl td{border:1px solid var(--line);padding:8px 10px;vertical-align:middle}
.tbl thead th{background:var(--head);color:var(--head-ink);font-weight:600;font-size:13px;text-align:center;white-space:nowrap;border-color:var(--head)}
.tbl tbody tr:nth-child(even) td{background:var(--surface2)}
.tbl td.n{text-align:right;white-space:nowrap}
.tbl td.c{text-align:center}
.tbl th.rowh,.tbl td.rowh{text-align:left;font-weight:600;background:var(--surface2);white-space:nowrap}
.tbl tr.total td{background:var(--total)!important;font-weight:700;border-top:2px solid var(--line-strong)}
.tbl tr.dim td{color:var(--faint)}
.xtbl td.n .xm,.xtbl td.n .xy{display:block}
.xtbl td.n .xm.z{color:var(--faint)}
.xtbl td.n .xy{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);margin-top:3px;padding-top:2px}
.mtbl{table-layout:fixed}
.mtbl td{vertical-align:middle}
.mtbl td.rowh{white-space:normal;word-break:keep-all;overflow-wrap:anywhere}
.mtbl th:nth-child(2),.mtbl td:nth-child(2){width:40%}
.mtbl th:nth-child(3){width:72px}
.mtbl td:nth-child(3){padding:6px}
.mtbl td.act2 .btn{display:flex;width:100%;min-height:30px;padding:0 4px;font-size:12.5px;margin:2px 0}
.mtbl tr.miss td[colspan]{width:auto}
.mtbl .sm{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.mtbl td .inp{min-height:40px;font-size:16px;width:100%;min-width:0;padding:6px 8px}
.mtbl tr.miss td{background:var(--field)!important}
.mtbl tr.sep td{background:var(--surface2)!important;font-size:12.5px;font-weight:700;color:var(--muted);padding:5px 10px}
.mtbl tr.done td{color:var(--muted)}
.mtbl tr.done td.rowh{color:var(--ink)}
.linkbtn{border:0;background:none;padding:2px 0;color:var(--accent);font-size:12.5px;font-weight:600;cursor:pointer;display:block}
.tp{display:inline-block;font-size:11.5px;font-weight:700;border-radius:3px;padding:0 5px;margin-right:5px;line-height:1.55;vertical-align:1px}
.tp.t-in{background:color-mix(in srgb,var(--income) 16%,var(--surface));color:var(--income)}
.tp.t-ex{background:color-mix(in srgb,var(--expense) 14%,var(--surface));color:var(--expense)}
.tp.t-sv{background:color-mix(in srgb,var(--save) 15%,var(--surface));color:var(--save)}
.tp.t-rp{background:color-mix(in srgb,var(--repay) 15%,var(--surface));color:var(--repay)}
.tp.t-tr{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.txlist tr.t-in td:first-child{box-shadow:inset 5px 0 0 var(--income)}
.txlist tr.t-ex td:first-child{box-shadow:inset 5px 0 0 var(--expense)}
.txlist tr.t-sv td:first-child{box-shadow:inset 5px 0 0 var(--save)}
.txlist tr.t-rp td:first-child{box-shadow:inset 5px 0 0 var(--repay)}
.txlist tr.t-tr td:first-child{box-shadow:inset 5px 0 0 var(--line-strong)}
.tbl tbody tr.t-in td{background:color-mix(in srgb,var(--income) 8%,var(--surface))}
.tbl tbody tr.t-tr td{color:var(--faint)}
.amt-ex{color:var(--expense)!important}
.txlist td.n .sm{font-size:11.5px}
.lastline{display:flex;justify-content:space-between;align-items:flex-end;gap:6px 14px;flex-wrap:wrap}
.lastline .big{font-size:20px;font-weight:700;letter-spacing:-.01em}
.lastinline{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;padding:8px 12px;border:1px solid var(--line);border-left:4px solid var(--expense);border-radius:6px;background:var(--surface2);font-size:14px}
@media (max-width:560px){.hide-sm{display:none}}
@media (min-width:561px){.show-sm{display:none}}
.itbl td.rowh{white-space:normal;word-break:keep-all}
.itbl td .btn.ghost{padding:0 6px}
.amtbtn{border:1px solid var(--line-strong);background:var(--field);border-radius:5px;padding:4px 8px;font:inherit;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer;color:var(--ink);white-space:nowrap}
.amtbtn:hover{border-color:var(--accent);background:var(--accent-soft)}
.amtbtn span{color:var(--accent);font-weight:400}
.who{display:inline-block;padding:1px 8px;border-radius:999px;font-size:13.5px;font-weight:600;line-height:1.55}
.who-A{background:var(--who-a-bg);color:var(--who-a)}
.who-B{background:var(--who-b-bg);color:var(--who-b)}
.who-J{background:var(--who-j-bg);color:var(--who-j)}
.ctbl tr.grp td{background:var(--accent-soft)!important;font-weight:700;border-top:2px solid var(--line-strong)}
.ctbl td.rowh.ind{padding-left:14px;font-weight:500}
.ctbl tr.catrow{cursor:pointer}
.ctbl tr.catrow:hover td,.ctbl tr.catrow[aria-expanded="true"] td{background:var(--accent-soft)!important}
.ctbl .chev{display:inline-block;width:16px;color:var(--accent);font-size:12px}
.ctbl tr.catdetail>td{padding:0;background:var(--surface)!important;border-left:3px solid var(--accent)}
.ctbl tr.catdetail .tbl{border-style:hidden;font-size:13.5px}
.tw:has(> .ctbl){container-type:inline-size}
.ctbl tr.catdetail .txlist{position:sticky;left:0;width:min(100%,calc(100vw - 38px));width:min(100%,100cqw)}
.ctbl tr.catdetail .tbl thead th{background:var(--surface2);color:var(--muted);border-color:var(--line);font-size:12px;padding:5px 8px}
.bdl{display:grid;grid-template-columns:86px minmax(0,1fr);margin:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.bdl dt{background:var(--surface2);font-weight:700;font-size:13.5px;padding:9px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.bdl dd{margin:0;padding:9px 12px;border-bottom:1px solid var(--line);line-height:1.6;min-width:0}
.bdl dt:last-of-type,.bdl dd:last-of-type{border-bottom:0}
.blist{list-style:none;margin:0 0 4px;padding:0}
.blist li{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dashed var(--line)}
.blist li:last-child{border-bottom:0}
.warn-t{color:var(--warn);font-weight:600}
.blist li>b{white-space:nowrap}
.bdl dt{word-break:keep-all}
@media (max-width:560px){.bdl{grid-template-columns:1fr}.bdl dt{border-right:0;padding:6px 12px;font-size:12.5px;color:var(--muted)}.bdl dd{padding-top:7px}}
.consult{display:flex;justify-content:flex-end;margin-top:-4px}
.consultbtn{border:0;background:none;padding:4px 2px;font-size:12px;color:var(--faint);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.consultbtn:hover{color:var(--muted)}
.bonus-line{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-top:6px;border-top:1px dashed var(--line)}
.bonus-line .inp{width:auto;min-height:38px;font-size:15px}
.bonus-line select.inp{max-width:160px}
.bonus-line input.inp{width:150px}
.bon{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.bon-chip{border:1px solid var(--line-strong);background:var(--surface2);border-radius:4px;padding:2px 8px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.tbl tr.subrow td{font-size:13.5px;color:var(--muted)}
.tbl tr.subrow td.rowh{font-weight:500;padding-left:22px}
.tbl thead tr.h2 th{background:color-mix(in srgb,var(--head) 82%,var(--surface));font-size:12.5px}
.tbl tr.hl td{background:var(--hl)!important}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--accent-soft)}
.card-b.flush .tbl{border-style:hidden}
.pos{color:var(--income)} .neg{color:var(--expense)}

/* chips & badges */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:4px;padding:1px 7px;border:1px solid transparent;white-space:nowrap;line-height:1.6}
.b-auto{background:var(--auto-bg);color:var(--auto-ink);border-color:color-mix(in srgb,var(--auto-ink) 25%,transparent)}
.b-warn{background:var(--warn-bg);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.b-bad{background:var(--bad-bg);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.b-ok{background:var(--ok-bg);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.b-plain{background:var(--surface2);color:var(--muted);border-color:var(--line)}
.b-ev{background:color-mix(in srgb,var(--event) 18%,var(--surface));color:var(--ink);border-color:color-mix(in srgb,var(--event) 50%,transparent)}
.statusbar{display:flex;flex-wrap:wrap;gap:6px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
@media (min-width:700px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1440px){.kpis{grid-template-columns:repeat(6,minmax(0,1fr))}}
.kpi{padding:12px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.kpi .l{font-size:13px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .l i{width:9px;height:9px;border-radius:2px;display:inline-block}
.kpi .v{font-family:var(--f-num);font-size:clamp(16px,4.4vw,22px);font-weight:600;letter-spacing:-.02em;margin-top:2px;overflow-wrap:anywhere}
.kpi .v small{font-family:var(--f-body);font-size:13px;font-weight:500;margin-left:2px;color:var(--muted)}
.kpi .d{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.kpi.main{background:var(--accent-soft)}
.note{font-size:12.5px;color:var(--muted);margin:6px 2px 0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:6px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:600;font-size:14.5px;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.small{min-height:32px;padding:0 10px;font-size:13.5px}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
#gSave.armed{background:#B57A00;border-color:#B57A00}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* form */
.form{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:700px){.form.two{grid-template-columns:1fr 1fr}.form .full{grid-column:1/-1}}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>label,.fld>.lab{font-size:13.5px;font-weight:600;color:var(--ink)}
.fld .req{color:var(--bad);margin-left:2px}
.fld .hint{font-size:12.5px;color:var(--muted)}
.inp{width:100%;min-height:44px;padding:8px 11px;border:1.5px solid var(--line-strong);border-radius:6px;background:var(--field);font-size:16px}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.inp.err{border-color:var(--bad)}
textarea.inp{min-height:80px;resize:vertical}
.amt{font-family:var(--f-num);font-size:20px;font-weight:600;text-align:right}
.seg{display:flex;flex-wrap:wrap;border:1.5px solid var(--line-strong);border-radius:6px;overflow:hidden;background:var(--field)}

<script id="logic">
/* ---------- 순수 계산 로직 (화면과 분리) ---------- */
const TYPES=['지출','수입','저축·투자','대출원금 상환','내부이체'];
const DEFAULTS={
  names:{A:'본인',B:'아내'},
  cats:{
    expense:['# 주거','관리비','가스비','전기·수도','세금','대출이자','주거 기타','# 생활','식비','외식·배달','생활용품','교통','통신·구독','보험','건강','여가','의류·미용','개인지출','경조사','기타지출'],
    wedding:['예식장·식대','스드메','예물','예단','혼수','청첩장·답례품','예복·한복','기타 결혼비용'],
    honeymoon:['항공','숙박','여행 식비','현지 교통','쇼핑','관광·투어','여행 준비','기타 여행비'],
    income:['급여','금융수입','축의금','결혼 지원금','기타수입'],
    bonus:['명절상여금','성과급','기타 상여'],
    extraIncome:['출장비','강사비','자료개발비','원고료','기타 수당'],
    saving:['청년도약계좌','적금','예금','ISA','ETF·주식','연금','기타저축'],
    repay:['주담대 원금','기타대출 원금'],
    transfer:['부부간 이체','카드대금','계좌간 이동','저축 인출·해지']
  },
  methods:['본인 급여통장','아내 급여통장','본인 신용카드','아내 신용카드','본인 체크카드','아내 체크카드','공동 통장','현금','기타'],
  events:['일상','결혼','신혼여행','기타이벤트'],
  assetKinds:['예금·입출금','적금','투자','보증금','기타자산'],
  parents:{rate:0.01,rule:'',person:'B'},
  estimateMissing:false,
  startMonth:202609,
  useShare:false,
  staleDays:45
};
const PK={init:'초기원금',deposit:'추가예치',withdraw:'원금회수',interest:'이자 수령'};
const ymOf=d=>d?(+String(d).slice(0,4))*100+(+String(d).slice(5,7)):null;
const addM=(m,k)=>{let y=Math.floor(m/100),mo=(m%100)-1+k;y+=Math.floor(mo/12);mo=((mo%12)+12)%12;return y*100+mo+1};
function dayDate(m,day){if(!day)return undefined;const y=Math.floor(m/100),mo=m%100,last=new Date(y,mo,0).getDate();return `${y}-${String(mo).padStart(2,'0')}-${String(Math.min(+day,last)).padStart(2,'0')}`}
const active=(it,m)=>!!it.start&&m>=it.start&&(!it.end||m<=it.end);
function mergeSettings(s){
  s=s||{};const o=JSON.parse(JSON.stringify(DEFAULTS));
  for(const k of Object.keys(s)){
    if(k==='cats'||k==='names'||k==='parents'){Object.assign(o[k],s[k]||{})}
    else o[k]=s[k];
  }
  return o;
}
function catGroupOf(S,type){return {'지출':'expense','수입':'income','저축·투자':'saving','대출원금 상환':'repay','내부이체':'transfer'}[type]}
/* '# 이름' 줄은 묶음 제목 */
function expGroups(list){const out=[];let cur=null;for(const raw of list||[]){const x=String(raw).trim();if(!x)continue;if(x.startsWith('#')){cur=[x.replace(/^#+\s*/,'')||'기타',[]];out.push(cur);continue}if(!cur){cur=[out.length?'기타':null,[]];out.push(cur)}cur[1].push(x)}const r=out.filter(g=>g[1].length);if(r.length===1&&r[0][0]===null)return r;return r.map(g=>[g[0]||'생활',g[1]])}
const expNames=list=>(list||[]).map(x=>String(x).trim()).filter(x=>x&&!x.startsWith('#'));
function catsFor(S,type,event){
  if(type==='수입')return [['기본 수입',S.settings.cats.income||[]],['상여·성과급',S.settings.cats.bonus||[]],['추가 소득 (비정기급여)',S.settings.cats.extraIncome||[]]];
  if(type!=='지출')return [[null,S.settings.cats[catGroupOf(S,type)]||[]]];
  const g=expGroups(S.settings.cats.expense);
  if(event==='결혼')return [['결혼',S.settings.cats.wedding||[]],...g];
  if(event==='신혼여행')return [['신혼여행',S.settings.cats.honeymoon||[]],...g];
  return g;
}
/* 부모님 예치 */
function pApplied(S,e){
  if(e.kind==='interest')return null;
  if(e.applyMonth)return +e.applyMonth;
  const r=S.settings.parents.rule;
  if(r==='same')return ymOf(e.date);
  if(r==='next')return addM(ymOf(e.date),1);
  return 'X';
}
const pSign=e=>e.kind==='init'||e.kind==='deposit'?+e.amount:(e.kind==='withdraw'?-e.amount:0);
function parentsMonth(S,m){
  let base=0,held=0,deposit=0,withdraw=0,actual=null;const unresolved=[];
  for(const e of S.parents){
    const amt=+e.amount||0;const em=ymOf(e.date);
    if(e.kind==='interest'){if(em===m)actual=(actual||0)+amt;continue}
    const a=pApplied(S,e);
    if(a==='X')unresolved.push(e);else if(a<=m)base+=pSign(e);
    if(em<=m)held+=pSign(e);
    if(em===m){if(e.kind==='deposit')deposit+=amt;if(e.kind==='withdraw')withdraw+=amt}
  }
  const expected=Math.round(base*(+S.settings.parents.rate||0));
  const counted=actual!=null?actual:expected;
  return {base,held,expected,actual,counted,deposit,withdraw,unresolved,diff:actual!=null?actual-expected:null};
}
/* 한 달의 모든 항목: 실제 거래 + 고정금액 자동반영 + (선택)매달입력 예상치 + 부모님 이자/예치 */
function monthEntries(S,m){
  const out=[];const txm=S.tx.filter(t=>t.month===m);
  for(const t of txm){
    out.push({src:'tx',ref:t,type:t.type,cat:t.cat,item:t.item,amount:+t.amount||0,user:t.user||'',share:t.share||'',event:t.event||'일상',nature:t.type==='지출'?(t.nature||'변동'):'',date:t.date});
  }
  const autos=[];
  for(const f of S.fixed){
    if(!active(f,m))continue;
    if(txm.some(t=>t.link&&t.link===f.group))continue;
    const e={src:'fixed',ref:f,type:f.type,cat:f.cat,item:f.name,amount:+f.amount||0,user:f.user,share:f.share||'',event:'일상',nature:f.type==='지출'?'고정':'',month:m,date:dayDate(m,f.day)};
    out.push(e);autos.push(e);
  }
  const missing=[],entered=[];
  for(const it of S.monthly){
    if(!active(it,m))continue;
    const got=txm.filter(t=>t.link===it.id);
    if(got.length){entered.push({it,tx:got,amount:got.reduce((s,t)=>s+(+t.amount||0),0)});continue}
    missing.push(it);
    if(S.settings.estimateMissing&&+it.expected>0){
      out.push({src:'estimate',ref:it,type:it.type,cat:it.cat,item:it.name,amount:+it.expected,user:it.user,share:it.share||'',event:'일상',nature:it.type==='지출'?(it.nature||'변동'):'',provisional:true,month:m});
    }
  }
  const p=parentsMonth(S,m);const pp=S.settings.parents.person||'B';
  if(p.counted>0)out.push({src:'parents',type:'수입',cat:'부모님 예치 이자',item:'부모님 예치 이자',amount:p.counted,user:pp,share:'',event:'일상',nature:'',provisional:p.actual==null});
  if(p.deposit>0)out.push({src:'parents',type:'저축·투자',cat:'부모님 예치',item:'부모님 추가 예치',amount:p.deposit,user:pp,share:'',event:'일상',nature:''});
  return {entries:out,autos,missing,entered,parents:p,txCount:txm.length};
}
function agg(S,m){
  const r=monthEntries(S,m);
  const z=()=>({A:0,B:0,J:0,T:0,X:0});
  const extraSet=new Set(S.settings.cats.extraIncome||[]),bonusSet=new Set(S.settings.cats.bonus||[]);

    expCats:{},evCats:{},evByEvent:{},incCats:{},savCats:{},repCats:{},provisional:0,r};
  const add=(o,u,v)=>{o.T+=v;if(u==='A'||u==='B'||u==='J')o[u]+=v;else o.X+=v};
  for(const e of r.entries){
    const v=e.amount;if(e.provisional)a.provisional++;
    if(e.type==='수입'){add(a.inc,e.user,v);a.incCats[e.cat]=(a.incCats[e.cat]||0)+v;
      if(bonusSet.has(e.cat))add(a.bonus,e.user,v);
      if(extraSet.has(e.cat)){add(a.extra,e.user,v);add(a.extraCats[e.cat]||(a.extraCats[e.cat]=z()),e.user,v)}}
    else if(e.type==='지출'){
      add(a.exp,e.user,v);
      if(e.nature==='고정')a.fixed+=v;else a.variable+=v;
      if(e.event==='일상'){a.daily+=v;a.expCats[e.cat]=(a.expCats[e.cat]||0)+v}
      else{a.event+=v;a.evCats[e.cat]=(a.evCats[e.cat]||0)+v;a.evByEvent[e.event]=(a.evByEvent[e.event]||0)+v}
      if(e.share==='personal')a.personal+=v;else a.shared+=v;
    }
    else if(e.type==='저축·투자'){add(a.sav,e.user,v);a.savCats[e.cat]=(a.savCats[e.cat]||0)+v}
    else if(e.type==='대출원금 상환'){add(a.rep,e.user,v);a.repCats[e.cat]=(a.repCats[e.cat]||0)+v}
    else if(e.type==='내부이체'){a.transfer+=v}
  }
  a.rest=a.inc.T-a.exp.T-a.sav.T-a.rep.T;
  a.saveRate=a.inc.T>0?a.sav.T/a.inc.T:null;
  a.empty=r.txCount===0&&r.autos.length===0&&r.entered.length===0&&a.inc.T===0&&a.exp.T===0;
  return a;
}

function eventSummary(S,ev){
  const list=S.tx.filter(t=>(t.event||'일상')===ev&&t.type!=='내부이체');
  const z=()=>({A:0,B:0,J:0,T:0});

  for(const t of list){const v=+t.amount||0;const u=t.user;
    const tgt=t.type==='지출'?o.exp:t.type==='수입'?o.inc:t.type==='저축·투자'?o.sav:null;if(!tgt)continue;
    tgt.T+=v;if(tgt[u]!=null)tgt[u]+=v;

    if(t.type==='수입'){const c=o.incCats[t.cat]||(o.incCats[t.cat]={T:0,A:0,B:0,J:0,n:0});c.T+=v;if(c[u]!=null)c[u]+=v;c.n++}
  }
  o.net={T:o.exp.T-o.inc.T,A:o.exp.A-o.inc.A,B:o.exp.B-o.inc.B,J:o.exp.J-o.inc.J};
  return o;
}
/* 대출 추정 잔액 */
function debtEstimate(S,d,m){
  if(!d.base&&d.base!==0||!d.asOf)return null;
  const am=ymOf(d.asOf);if(m<am)return {paid:0,est:+d.base};
  let paid=0;
  for(let k=am;k<=m;k=addM(k,1)){
    const r=monthEntries(S,k);
    for(const e of r.entries){
      if(e.type!=='대출원금 상환'||e.cat!==d.cat)continue;
      if(e.src==='tx'){if(e.date>d.asOf)paid+=e.amount}
      else if(k>am)paid+=e.amount;
    }
  }
  return {paid,est:+d.base-paid};
}
function dataMonths(S){
  const ms=new Set();
  S.tx.forEach(t=>t.month&&ms.add(t.month));
  S.fixed.forEach(f=>f.start&&ms.add(f.start));S.monthly.forEach(f=>f.start&&ms.add(f.start));
  S.parents.forEach(p=>p.date&&ms.add(ymOf(p.date)));
  return [...ms].sort((a,b)=>a-b);
}

/* ---------- 폼 빌더 ---------- */
function fieldHtml(f,v,err,pfx){
  const id=pfx+'-'+f.k;const req=f.req?'<span class="req">*</span>':'';
  const lab=`<label for="${id}">${esc(f.label)}${req}</label>`;
  const hint=f.hint?`<div class="hint">${f.hint}</div>`:'';
  const e=err?`<div class="ferr">${esc(err)}</div>`:'';
  const full=f.full?' full':'';
  if(f.type==='seg'){
    return `<div class="fld${full}"><div class="lab" id="${id}-l">${esc(f.label)}${req}</div><div class="seg" role="group" aria-labelledby="${id}-l">${f.options.map(([ov,ol])=>`<button type="button" data-seg="${f.k}" data-v="${esc(ov)}" aria-pressed="${String(v)===String(ov)}">${esc(ol)}</button>`).join('')}</div>${hint}${e}</div>`;
  }
  if(f.type==='select'){
    const groups=f.groups||[[null,f.options]];
    const opts=groups.map(([g,os])=>{const inner=os.map(o=>{const[ov,ol]=Array.isArray(o)?o:[o,o];return `<option value="${esc(ov)}" ${String(v)===String(ov)?'selected':''}>${esc(ol)}</option>`}).join('');return g?`<optgroup label="${esc(g)}">${inner}</optgroup>`:inner}).join('');
    return `<div class="fld${full}">${lab}<select class="inp${err?' err':''}" id="${id}" data-k="${f.k}"><option value="">${f.placeholder||'선택'}</option>${opts}</select>${hint}${e}</div>`;
  }
  if(f.type==='won'){
    return `<div class="fld${full}">${lab}<input class="inp amt${err?' err':''}" id="${id}" data-k="${f.k}" data-won="1" inputmode="numeric" autocomplete="off" placeholder="0" value="${v===''||v==null?'':won(v)}">${hint}${e}</div>`;
  }
  if(f.type==='textarea')return `<div class="fld${full}">${lab}<textarea class="inp" id="${id}" data-k="${f.k}">${esc(v)}</textarea>${hint}${e}</div>`;
  const t={date:'date',month:'month',num:'number',text:'text'}[f.type]||'text';
  const val=f.type==='month'?mIso(v):v;
  return `<div class="fld${full}">${lab}<input class="inp${err?' err':''}" type="${t}" id="${id}" data-k="${f.k}" ${f.list?`list="${f.list}"`:''} ${f.type==='num'?'inputmode="decimal" step="any"':''} value="${esc(val??'')}" autocomplete="off">${hint}${e}</div>`;
}
function formHtml(fields,vals,errs,pfx,two){
  return `<div class="form${two?' two':''}">`+fields.filter(f=>!f.show||f.show(vals)).map(f=>fieldHtml(f,vals[f.k],errs[f.k],pfx)).join('')+'</div>';
}
function bindForm(root,fields,vals,rerender){
  root.querySelectorAll('[data-seg]').forEach(b=>b.onclick=()=>{const f=fields.find(x=>x.k===b.dataset.seg);let v=b.dataset.v;vals[f.k]=(vals[f.k]===v&&f.toggle)?'':v;f.onChange&&f.onChange(vals);keepFocus(rerender)});
  root.querySelectorAll('[data-k]').forEach(el=>{
    const f=fields.find(x=>x.k===el.dataset.k);if(!f)return;
    const upd=()=>{
      if(el.dataset.won){const digits=el.value.replace(/[^\d]/g,'');vals[f.k]=digits===''?'':+digits;const pos=el.value.length-el.selectionStart;el.value=digits===''?'':won(+digits);try{const p=Math.max(0,el.value.length-pos);el.setSelectionRange(p,p)}catch(_){}}
      else if(f.type==='month')vals[f.k]=isoToM(el.value);
      else if(f.type==='num')vals[f.k]=el.value===''?'':+el.value;
      else vals[f.k]=el.value;
    };
    el.addEventListener('input',upd);
    el.addEventListener('change',()=>{upd();if(el.tagName==='SELECT'||f.rerender){f.onChange&&f.onChange(vals);setTimeout(()=>keepFocus(rerender),0)}});
  });
}
function validate(fields,vals){
  const errs={};
  for(const f of fields){if(f.show&&!f.show(vals))continue;const v=vals[f.k];
    if(f.req&&(v===''||v==null))errs[f.k]=f.type==='won'?'금액을 입력하세요':(f.type==='seg'||f.type==='select'?'선택하세요':'입력하세요');
    if(f.type==='won'&&v!==''&&v!=null&&(+v<0))errs[f.k]='0 이상으로 입력하세요';
    if(f.check){const m=f.check(v,vals);if(m)errs[f.k]=m}
  }
  return errs;
}

/* sheet */
let sheetState=null;
function openSheet(o){sheetState={vals:{...o.values},errs:{},...o};drawSheet();setTimeout(()=>{const el=$('#sheetRoot .inp');el&&el.focus()},50)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetState&&!e.defaultPrevented&&!(gd&&gd.el===document.activeElement))closeSheet()});
function closeSheet(){sheetState=null;$('#sheetRoot').innerHTML='';if(renderPending){renderPending=false;render()}}
function drawSheet(){
  const s=sheetState;if(!s)return;
  const fields=typeof s.fields==='function'?s.fields(s.vals):s.fields;
  const warnOn=!!s.warn&&(!s.warnKey||s.warnKey(s.vals)===s.dupOk);
  const body=(s.intro?`<p class="sub" style="margin-bottom:12px">${s.intro}</p>`:'')+formHtml(fields,s.vals,s.errs,'sh',true)+(s.extra?s.extra(s.vals):'')+(warnOn?`<div class="dupwarn" role="alert">⚠ ${esc(s.warn)}</div>`:'');
  $('#sheetRoot').innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shT">
    <div class="sheet-h"><h2 id="shT">${esc(s.title)}</h2><button class="x" id="shX" aria-label="닫기">×</button></div>
    <div class="sheet-b">${body}
    <div class="formbar">${s.onDelete?`<button class="btn danger" id="shDel">삭제</button><span class="spacer"></span>`:''}<button class="btn" id="shCancel">취소</button><button class="btn primary" id="shSave" ${canWrite?'':'disabled'}>${esc(warnOn?'그래도 저장':(s.saveLabel||'저장'))}</button></div></div></div></div>`;
  const root=$('#sheetRoot');
  bindForm(root,fields,s.vals,drawSheet);
  $('#shX').onclick=$('#shCancel').onclick=closeSheet;
  $('#shSave').onclick=async()=>{
    const f2=typeof s.fields==='function'?s.fields(s.vals):s.fields;
    s.errs=validate(f2,s.vals);if(Object.keys(s.errs).length){drawSheet();return}
    const b=$('#shSave');b.disabled=true;
    try{await s.onSave(s.vals);closeSheet();toast(s.savedMsg||'저장했습니다')}catch(e){b.disabled=false}
  };
  if(s.onDelete){const d=$('#shDel');d.onclick=async()=>{if(!d.classList.contains('armed')){d.classList.add('armed');d.textContent='한 번 더 누르면 삭제';return}try{await s.onDelete();closeSheet();toast('삭제했습니다')}catch(e){}}}
}

function txToVals(t){return {type:t.type||'지출',date:t.date||defDate(curM),amount:t.amount??'',event:t.event&&t.event!=='일상'?t.event:'',cat:t.cat||'',item:t.item||'',user:t.user||'',share:t.share||'shared',method:t.method||'',memo:t.memo||''}}
function valsToTx(v,base){

/* 중복 입력 확인: 같은 날짜·구분·금액에 내용(내용이 없으면 카테고리)까지 같으면 의심 */
const normItem=x=>String(x||'').replace(/\s+/g,'').toLowerCase();
const dupKey=t=>[t.date,t.type,+t.amount||0,normItem(t.item),normItem(t.item)?'':(t.cat||'')].join('|');
function findDup(tx,ignoreId){const k=dupKey(tx);return S.tx.find(t=>t.id!==ignoreId&&dupKey(t)===k)}
function dupMsg(d){return `${fmtMD(d.date)} '${d.item||d.cat}' ${won(d.amount)}원이 이미 기록되어 있습니다(${uname(d.user)||'사용자 없음'}). 두 번 산 게 맞다면 한 번 더 저장을 누르세요.`}

    warnKey:v=>dupKey(valsToTx(v,base)),

/* ---------- 상담용 요약 (Claude 대화에 붙여넣기) ---------- */
function consultText(range,detail){
  const end=curM,start0=minM()||dataMonths(S)[0]||curM;let months=[];
  if(range==='cur')months=[end];
  else if(range==='3m'){for(let i=2;i>=0;i--){const k=addM(end,-i);if(k>=start0)months.push(k)}}
  else for(let k=Math.min(start0,end);k<=end;k=addM(k,1))months.push(k);
  if(!months.length)months=[end];
  const A=months.map(m=>agg(S,m)),nm=A.length,W=v=>won(v),L=[];
  const sumF=f=>A.reduce((s,a)=>s+f(a),0),avg=v=>W(Math.round(v/nm));
  const bonusSet=new Set(S.settings.cats.bonus||[]),extraSet=new Set(S.settings.cats.extraIncome||[]);
  const baseInc=a=>Object.entries(a.incCats).filter(([n])=>!bonusSet.has(n)&&!extraSet.has(n)).reduce((s,[,v])=>s+v,0);
  L.push('[우리집 가계부 상담용 요약]');
  L.push(`작성일 ${todayIso()} · 기간 ${mIso(months[0])} ~ ${mIso(months[nm-1])} (${nm}개월) · 금액 단위: 원`);
  L.push(`가구: ${uname('A')}·${uname('B')} 부부 (2026년 9월 결혼) · 가계부 시작 ${mIso(minM()||months[0])}`);
  L.push('잔여 = 수입 − 지출 − 저축·투자 − 대출원금 상환 (통장 잔액 아님). 내부이체·카드대금 출금은 제외됨.');
  L.push('','■ 월별 흐름','월 | 수입 | └기본 | └상여 | └추가소득 | 지출 | └고정 | └변동 | └이벤트 | 저축·투자 | 원금상환 | 잔여 | 저축률 | 기록 상태');
  const row=(lab,f)=>[lab,f(a=>a.inc.T),f(baseInc),f(a=>a.bonus.T),f(a=>a.extra.T),f(a=>a.exp.T),f(a=>a.fixed),f(a=>a.variable),f(a=>a.event),f(a=>a.sav.T),f(a=>a.rep.T),f(a=>a.rest)];
  A.forEach(a=>L.push([...row(mIso(a.m),g=>W(g(a))),pct(a.saveRate),a.empty?'기록 없음':(a.r.missing.length?`미입력 ${a.r.missing.length}건`:'입력 완료')].join(' | ')));
  if(nm>1){const ti=sumF(a=>a.inc.T),ts=sumF(a=>a.sav.T);L.push([...row('합계',g=>W(sumF(g))),ti?pct(ts/ti):'–',''].join(' | '));L.push([...row('월평균',g=>avg(sumF(g))),'',''].join(' | '))}
  // 일상 지출 카테고리
  const dailyT=sumF(a=>a.daily),cat={};A.forEach(a=>Object.entries(a.expCats).forEach(([n,v])=>cat[n]=(cat[n]||0)+v));
  const groups=expGroups(S.settings.cats.expense),known=new Set(groups.flatMap(g=>g[1])),other=Object.keys(cat).filter(n=>!known.has(n));if(other.length)groups.push(['기타',other]);
  L.push('',`■ 일상 지출 카테고리 (기간 합계 ${W(dailyT)} · 월평균 · 비중)`);
  for(const[g,names]of groups){const rows=names.filter(n=>cat[n]).sort((x,y)=>cat[y]-cat[x]);if(!rows.length)continue;const gt=rows.reduce((s,n)=>s+cat[n],0);
    L.push(`${g||'지출'} ${W(gt)} (${pct(gt/(dailyT||1))})`);rows.forEach(n=>L.push(`  - ${n}: ${W(cat[n])} · 월평균 ${avg(cat[n])} · ${pct(cat[n]/(dailyT||1))}`))}
  const ev={};A.forEach(a=>Object.entries(a.evByEvent).forEach(([k,v])=>ev[k]=(ev[k]||0)+v));
  if(Object.keys(ev).length){L.push('','■ 이벤트 지출 (일상 생활비와 별도 집계)');Object.entries(ev).forEach(([k,v])=>L.push(`  - ${k}: ${W(v)}`))}
  const big=S.tx.filter(t=>t.type==='지출'&&months.includes(t.month)&&+t.amount>=300000).sort((x,y)=>y.amount-x.amount);
  if(big.length){L.push('','■ 큰 지출 (30만 원 이상)');big.forEach(t=>L.push(`  - ${t.date} ${t.item||t.cat} (${t.cat}${t.event&&t.event!=='일상'?', '+t.event:''}) ${W(t.amount)} · ${uname(t.user)}${t.memo?` · 메모: ${String(t.memo).slice(0,90)}`:''}`))}
  // 수입
  const inc={};A.forEach(a=>a.r.entries.filter(e=>e.type==='수입').forEach(e=>{const o=inc[e.cat]||(inc[e.cat]={A:0,B:0,J:0,T:0});o.T+=e.amount;if(o[e.user]!=null)o[e.user]+=e.amount}));
  L.push('','■ 수입 상세 (기간 합계)');
  Object.entries(inc).sort((x,y)=>y[1].T-x[1].T).forEach(([k,o])=>L.push(`  - ${k}${bonusSet.has(k)?' (상여)':extraSet.has(k)?' (추가 소득)':''}: ${W(o.T)} (${uname('A')} ${W(o.A)} / ${uname('B')} ${W(o.B)}${o.J?` / 공동 ${W(o.J)}`:''})`));
  if(!Object.keys(inc).length)L.push('  - 기록 없음');
  const sv={};A.forEach(a=>Object.entries(a.savCats).forEach(([k,v])=>sv[k]=(sv[k]||0)+v));
  L.push('','■ 저축·투자 (기간 합계)');
  if(Object.keys(sv).length)Object.entries(sv).sort((x,y)=>y[1]-x[1]).forEach(([k,v])=>L.push(`  - ${k}: ${W(v)}`));else L.push('  - 기록 없음 (실제로 안 한 것인지, 기록만 안 한 것인지 확인 필요)');
  // 고정·할부
  L.push('',`■ 고정 지출·구독·할부 (${mIso(end)} 기준 자동 반영 항목)`);
  let fixT=0;const ending=[];
  fixedGroups().forEach(g=>{const c=g.find(f=>active(f,end));if(!c)return;const ii=instInfo(c,end);if(c.type==='지출')fixT+=+c.amount;
    L.push(`  - ${c.name}: ${W(c.amount)} · ${c.type}/${c.cat} · ${uname(c.user)}${c.day?` · 매월 ${c.day}일`:''}${ii?` · 할부 ${ii.n}/${ii.tot}회, ${mIso(ii.end)} 종료`:c.end?` · ${mIso(c.end)} 종료`:''}`);
    const e=ii?ii.end:c.end;if(e&&e<=addM(end,12))ending.push([e,c])});
  L.push(`  지출 합계: 월 ${W(fixT)}`);

  tb.addEventListener('input',e=>{const el=e.target;if(!el.dataset.r)return;const r=+el.dataset.r,k=GCOLS[+el.dataset.c][0];
    if(k==='amount'){const raw=el.value;const neg=/^[-−]/.test(raw.trim());const d=raw.replace(/[^\d]/g,'');el.value=d?(neg?'-':'')+won(+d):(neg?'-':'');}
    grid[r][k]=el.value;if(!gdSuppress)gdOpen(el,true);
    gridStore();clearTimeout(bindGrid.t);bindGrid.t=setTimeout(gridRefreshStatus,120)});
  tb.addEventListener('keydown',e=>{const el=e.target;if(!el.dataset||el.dataset.r==null)return;const r=+el.dataset.r,c=+el.dataset.c;
    if(gd&&gd.el===el){if(e.key==='ArrowDown'){e.preventDefault();gdMove(1);return}if(e.key==='ArrowUp'){e.preventDefault();gdMove(-1);return}if(e.key==='Escape'){gdClose();return}if(e.key==='Enter'&&gd.hi>=0&&!e.isComposing){e.preventDefault();gdPick(gd.hi);return}}
    if(e.key==='Enter'&&!e.isComposing){e.preventDefault();const nr=e.shiftKey?r-1:r+1;if(nr<0)return;
      if(nr>=grid.length){for(let i=0;i<10;i++)grid.push({});gridStore();render();}

    if(!/[\t\n]/.test(txt.replace(/\n$/,'')))return;e.preventDefault();

  document.querySelectorAll('[data-gdel]').forEach(b=>b.onclick=()=>{grid.splice(+b.dataset.gdel,1);while(grid.length<12)grid.push({});gridStore();render()});
  $('#gPaste').onchange=e=>{gridPaste=e.target.value;lsSet('hb.gpaste',gridPaste)};
  $('#gMore').onclick=()=>{for(let i=0;i<10;i++)grid.push({});gridStore();render()};
  const cl=$('#gClear');cl.onclick=()=>{if(!cl.classList.contains('armed')){cl.classList.add('armed');cl.textContent='한 번 더 누르면 모두 지웁니다';return}grid=[];while(grid.length<12)grid.push({});gridStore();render()};
  $('#gfApply').onclick=()=>{const u=$('#gfUser').value,m=$('#gfMethod').value,ev=$('#gfEvent').value;let n=0;
    grid.forEach(r=>{if(rowBlank(r))return;if(u&&!String(r.user||'').trim()){r.user=u;n++}if(m&&!String(r.method||'').trim()){r.method=m;n++}if(ev&&!String(r.event||'').trim()){r.event=ev;n++}});
    gridStore();render();toast(n?`빈 칸 ${n}개를 채웠습니다`:'채울 빈 칸이 없습니다')};
  const sv=$('#gSave');sv.onclick=async()=>{
    const ev=evalGrid();const ok=ev.map((e,i)=>({e,i})).filter(x=>!x.e.blank&&!x.e.errs.length);
    if(!ok.length){toast(ev.some(e=>!e.blank)?'확인이 필요한 행을 먼저 고쳐 주세요':'입력한 행이 없습니다');return}
    const nd=ok.filter(x=>x.e.dup).length;

const AGROUPS=[['예금·적금',/예금|입출|적금|현금|cma|파킹|청년|통장/i,'var(--save)'],['투자',/투자|주식|펀드|etf|코인|연금|isa|채권/i,'var(--repay)'],['부동산',/부동산|아파트|주택|보증금|토지|오피스텔|빌라/i,'var(--event)'],['부모님 예치',/부모님/,'var(--pteal)']];
function aGroup(kind){for(const [n,re,c] of AGROUPS)if(re.test(kind||''))return {n,c};return {n:'기타',c:'var(--faint)'}}
function donutSvg(segs,label,value){
  const R=62,C=2*Math.PI*R,tot=segs.reduce((s,x)=>s+x.v,0);let off=0;const gap=segs.filter(x=>x.v>0).length>1?2:0;
  const arcs=tot>0?segs.filter(x=>x.v>0).map(x=>{const len=x.v/tot*C;const a=`<circle cx="84" cy="84" r="${R}" fill="none" style="stroke:${x.c}" stroke-width="26" stroke-dasharray="${Math.max(len-gap,0.5)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 84 84)"><title>${esc(x.n)} ${won(x.v)}원</title></circle>`;off+=len;return a}).join(''):`<circle cx="84" cy="84" r="${R}" fill="none" stroke="var(--line)" stroke-width="26"/>`;
  return `<svg viewBox="0 0 168 168" role="img" aria-label="${esc(label)}">${arcs}<text x="84" y="78" text-anchor="middle" class="pc-t">${esc(label)}</text><text x="84" y="98" text-anchor="middle" class="pc-v">${value}</text></svg>`;
}
const eok=v=>{const a=Math.abs(v),sg=v<0?'−':'';if(a>=1e8){const e=Math.floor(a/1e8),m=Math.round((a%1e8)/1e4);return `${sg}${e}억${m?` ${won(m)}만`:''}`}return `${sg}${won(Math.round(a/1e4))}만`};
const ppct=(v,t)=>t>0?`${(v/t*100).toFixed(v/t<0.1?1:0)}%`:'–';
function legend(segs,tot){return `<div class="plg">${segs.map(x=>`<div><i style="background:${x.c}"></i><span>${esc(x.n)}</span><span class="n">${eok(x.v)}</span><span class="p">${ppct(x.v,tot)}</span>${x.sub?`<span class="s">${esc(x.sub)}</span>`:''}</div>`).join('')}</div>`}
function assetPies(rows,totA,totD){
  const cNet='var(--income)',cDebt='var(--expense)';
  const net=totA-totD;
  const s1=[{n:'순자산',v:Math.max(net,0),c:cNet},{n:'부채',v:totD,c:cDebt}];
  const by=new Map();rows.forEach(a=>{const v=+a.amount||0;if(v<=0)return;const g=a.auto?{n:'부모님 예치',c:'var(--pteal)'}:aGroup(a.kind);const o=by.get(g.n)||{n:g.n,v:0,c:g.c,items:[]};o.v+=v;o.items.push(a.name||a.kind);by.set(g.n,o)});
  let s2=[...by.values()];let note='';
  if(totD>0){const re=by.get('부동산');
    if(re&&re.v>=totD){re.gross=re.v;re.v-=totD;re.sub=`${eok(re.gross)} − 부채 ${eok(totD)}`;re.n='부동산 (대출 제외)'}
    else note='부채가 부동산보다 많아 부채를 뺀 순자산 구성은 대략적으로만 보여 줍니다(부채는 빼지 않음).'}
  s2=s2.filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const t2=s2.reduce((s,x)=>s+x.v,0);
  const one=`<div class="pie"><h3>총자산 ${eok(totA)} = 순자산 + 부채</h3>${donutSvg(s1,'총자산',eok(totA))}${legend(s1,totA)}</div>`;
  const two=`<div class="pie"><h3>순자산 구성 — 어디에 있나</h3>${donutSvg(s2,note?'자산':'순자산',eok(t2))}${legend(s2,t2)}${note?`<p class="pnote">${esc(note)}</p>`:by.get('부동산')?.gross!=null?'<p class="pnote">부동산은 대출을 뺀 금액(내 몫)으로 넣었습니다.</p>':''}</div>`;
  return totA>0?`<section class="card"><div class="card-h"><h2>한눈에 보기</h2></div><div class="pies">${one}${two}</div></section>`:'';
}

  ${assetPies(rows,totA,totD)}
  <section class="card"><div class="card-h"><h2>자산</h2><span class="spacer"></span><button class="btn small primary" id="aAdd" ${canWrite?'':'disabled'}>+ 자산</button></div><div class="card-b flush tw"><table class="tbl"><thead><tr><th>구분</th><th>항목</th><th>소유</th><th>금액(원)</th><th>기준일</th><th>상태</th></tr></thead><tbody>

  const lo=$('#lgOut');lo&&(lo.onclick=signOutNow);
  $('#bkJson').onclick=()=>download(`gagyebu-backup-${todayIso()}.json`,JSON.stringify({app:'우리집 가계부',version:1,exportedAt:new Date().toISOString(),settings:S.settings,...Object.fromEntries(COLS.map(c=>[c,S[c]]))},null,1));
  $('#bkCsv').onclick=()=>{
    const head=['날짜','연월','구분','카테고리','상세','금액','사용자','공동/개인','결제수단','이벤트','고정/변동','정기항목연결','메모'];
    const q=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
    const lk=t=>t.link?(S.fixed.find(f=>f.group===t.link)?.name||S.monthly.find(m=>m.id===t.link)?.name||''):'';
    const rows=[...S.tx].sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(t=>[t.date,t.month,t.type,t.cat,t.item,t.amount,uname(t.user),t.share==='personal'?'개인':t.share==='shared'?'공동생활비':'',t.method,t.event,t.nature,lk(t),t.memo].map(q).join(','));
    download(`gagyebu-transactions-${todayIso()}.csv`,'﻿'+[head.join(','),...rows].join('\n'));
  };
  $('#bkFile').onchange=async e=>{
    const f=e.target.files[0];if(!f)return;const msg=$('#bkMsg');
    try{const j=JSON.parse(await f.text());if(!j||!COLS.some(c=>Array.isArray(j[c])))throw new Error('형식');
      const n=COLS.reduce((s,c)=>s+(j[c]?.length||0),0);
      msg.innerHTML=`<div class="banner info">백업 파일: 기록 ${n}건 (${COLS.map(c=>`${c} ${j[c]?.length||0}`).join(', ')}). <button class="btn small primary" id="bkGo" ${canWrite?'':'disabled'}>복원 실행</button></div>`;
      $('#bkGo').onclick=async()=>{const b=$('#bkGo');b.disabled=true;let done=0;
        try{if(j.settings)await saveSettings(j.settings);
          for(const c of COLS)for(const r of (j[c]||[])){if(!r.id)continue;await put(c,r.id,r);done++;if(done%20===0)b.textContent=`복원 중 ${done}/${n}`}
          msg.innerHTML=`<div class="banner info">${done}건을 복원했습니다.</div>`}catch(err){msg.innerHTML=`<div class="banner">${done}건까지 복원하고 멈췄습니다. 다시 시도해 주세요.</div>`}};
    }catch(err){msg.innerHTML='<div class="banner">이 앱에서 내려받은 백업(.json) 파일이 아닙니다.</div>'}
  };
}
function download(name,text){
  try{const blob=new Blob([text],{type:name.endsWith('.csv')?'text/csv;charset=utf-8':'application/json;charset=utf-8'});
    const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1500);toast('파일을 내려받았습니다')}
  catch(e){toast('파일을 저장하지 못했습니다')}
}
function vMore(){
  return `<div class="stack">${banners()}<h1>더보기</h1><section class="card morelist">
  <a href="#events">결혼·여행 정산<span>예식·예물·혼수, 신혼여행 경비, 축의금</span></a>
  <a href="#parents">부모님 예치<span>원금 ${won(parentsMonth(S,curM).held)}원</span></a>
  <a href="#assets">자산현황<span>총자산·총부채·순자산</span></a>
  <a href="#prefs">설정·백업<span>카테고리, 이름, 백업</span></a></section></div>`;
}

/* ---------- 앱 잠금 ---------- */
S.lock=null;S.lockLoaded=false;S.isOwner=false;
const ss={get:k=>{try{return sessionStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){}},del:k=>{try{sessionStorage.removeItem(k)}catch(e){}}};
let memUnlock=null,lockInput='',lockErr='',lockFails=0,lockUntil=0,lockBusy=false,hiddenAt=0;
const isUnlocked=()=>!S.lock||ss.get('hb.unlock')===S.lock.hash||memUnlock===S.lock.hash;
async function hashPin(pin,salt){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pin));return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}
function lockNow(){ss.del('hb.unlock');memUnlock=null;lockInput='';lockErr='';render()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(S.lock&&hiddenAt&&Date.now()-hiddenAt>5*60e3&&isUnlocked())lockNow()});
$('#lockBtn').onclick=lockNow;
function drawLock(){
  const len=S.lock.len||4;const wait=Math.max(0,Math.ceil((lockUntil-Date.now())/1000));
  $('#lockRoot').innerHTML=`<div class="lock" role="dialog" aria-modal="true" aria-labelledby="lkT"><div class="lock-in">
   <div class="brand"><span class="dot"></span><span>우리집 가계부</span></div>
   <h1 id="lkT" style="font-size:19px;margin:6px 0 0">잠금번호를 입력하세요</h1>
   <div class="dots" role="status" aria-label="${len}자리 중 ${lockInput.length}자리 입력">${Array.from({length:len},(_,i)=>`<i class="${i<lockInput.length?'on':''}"></i>`).join('')}</div>
   <div class="ferr" style="min-height:21px" aria-live="assertive">${wait?`${wait}초 후 다시 시도하세요`:esc(lockErr)}</div>
   <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" data-pin="${n}" ${wait?'disabled':''}>${n}</button>`).join('')}<span></span><button type="button" data-pin="0" ${wait?'disabled':''}>0</button><button type="button" data-pin="del" aria-label="한 자리 지우기">⌫</button></div>
   ${S.isOwner?`<button type="button" class="btn ghost small" id="lkForgot">잠금번호를 잊었어요 (소유자)</button>`:`<p class="sub">잠금번호는 가계부를 만든 사람에게 물어보세요.</p>`}
  </div></div>`;
  document.querySelectorAll('[data-pin]').forEach(b=>b.onclick=()=>pinPress(b.dataset.pin));
  const f=$('#lkForgot');f&&(f.onclick=async()=>{if(!f.classList.contains('armed')){f.classList.add('armed');f.textContent='한 번 더 누르면 잠금을 끕니다';return}
    try{await settle(DB.doc('config/lock').delete());toast('잠금을 껐습니다. 설정에서 새 잠금번호를 정하세요')}catch(e){}});
  if(wait){clearTimeout(drawLock.t);drawLock.t=setTimeout(()=>{if(S.lock&&!isUnlocked())drawLock()},1000)}
}
async function pinPress(k){
  if(!S.lock||lockBusy||Date.now()<lockUntil)return;
  const len=S.lock.len||4;
  if(k==='del'){lockInput=lockInput.slice(0,-1);lockErr='';drawLock();return}
  if(lockInput.length>=len)return;
  lockInput+=k;lockErr='';drawLock();
  if(lockInput.length<len)return;
  lockBusy=true;
  try{const h=await hashPin(lockInput,S.lock.salt);
    if(h===S.lock.hash){ss.set('hb.unlock',h);memUnlock=h;lockInput='';lockFails=0;$('#lockRoot').innerHTML='';render()}
    else{lockFails++;lockInput='';lockErr='잠금번호가 맞지 않습니다';if(lockFails>=5){lockFails=0;lockUntil=Date.now()+30000}drawLock()}}
  finally{lockBusy=false}
}
document.addEventListener('keydown',e=>{if(!S.lock||isUnlocked()||!$('#lockRoot').innerHTML)return;if(/^\d$/.test(e.key))pinPress(e.key);else if(e.key==='Backspace')pinPress('del')});
function accountCard(){if(mode!=='db'||!AUTH_USER)return '';return `<section class="card"><div class="card-h"><h2>로그인 계정</h2>${S.isOwner?'<span class="badge b-auto">소유자</span>':''}</div><div class="card-b row"><span>${esc(AUTH_USER.email||'')}</span><span class="spacer"></span><button class="btn small" id="lgOut">로그아웃</button></div></section>`}
function lockCard(){
  if(mode!=='db')return '';
  const st=S.lock?`<span class="badge b-ok">사용 중 · ${S.lock.len||4}자리</span>`:'<span class="badge b-plain">꺼짐</span>';
  if(!S.isOwner)return `<section class="card"><div class="card-h"><h2>앱 잠금</h2>${st}</div><div class="card-b"><p class="sub" style="margin:0">잠금번호는 가계부 소유자(처음 로그인한 남편 계정)만 바꿀 수 있습니다.</p></div></section>`;
  return `<section class="card"><div class="card-h"><h2>앱 잠금</h2>${st}</div><div class="card-b stack" style="gap:12px">
   <p class="sub">앱을 열 때마다 잠금번호를 묻습니다. 다른 앱에 5분 넘게 있다가 돌아와도 다시 묻습니다. 두 분이 같은 번호를 씁니다.</p>
   <div class="form two"><div class="fld"><label for="lk1">${S.lock?'새 ':''}잠금번호 (숫자 4~6자리)</label><input class="inp" id="lk1" type="password" inputmode="numeric" autocomplete="new-password" maxlength="6"></div>
   <div class="fld"><label for="lk2">한 번 더 입력</label><input class="inp" id="lk2" type="password" inputmode="numeric" autocomplete="new-password" maxlength="6"></div></div>
   <div id="lkMsg" class="ferr" aria-live="polite"></div>
   <div class="row"><button class="btn primary" id="lkSave">${S.lock?'잠금번호 변경':'잠금 켜기'}</button>${S.lock?'<button class="btn" id="lkNow">지금 잠그기</button><span class="spacer"></span><button class="btn danger" id="lkOff">잠금 끄기</button>':''}</div></div></section>`;
}
function bindLockPrefs(){
  const sv=$('#lkSave');if(!sv)return;
  sv.onclick=async()=>{const a=$('#lk1').value.trim(),b=$('#lk2').value.trim(),m=$('#lkMsg');
    if(!/^\d{4,6}$/.test(a)){m.textContent='숫자 4~6자리로 입력하세요';return}
    if(a!==b){m.textContent='두 번 입력한 번호가 다릅니다';return}
    sv.disabled=true;
    try{const salt=[...crypto.getRandomValues(new Uint8Array(12))].map(x=>x.toString(16).padStart(2,'0')).join('');const hash=await hashPin(a,salt);
      ss.set('hb.unlock',hash);memUnlock=hash;
      await settle(DB.doc('config/lock').set({hash,salt,len:a.length,updatedAt:new Date().toISOString()}));toast('잠금번호를 저장했습니다')}
    catch(e){sv.disabled=false}};
  const n=$('#lkNow');n&&(n.onclick=lockNow);
  const o=$('#lkOff');o&&(o.onclick=async()=>{if(!o.classList.contains('armed')){o.classList.add('armed');o.textContent='한 번 더 누르면 꺼집니다';return}
    try{await settle(DB.doc('config/lock').delete());toast('잠금을 껐습니다')}catch(e){}});
}

/* ---------- 렌더 ---------- */
function render(){
  if(minM()&&curM<minM())curM=minM();
  $('#mLabel').textContent=mLabel(curM);$('#mPrev').disabled=!!minM()&&curM<=minM();$('#mPick').min=minM()?mIso(minM()):'';
  renderNav();
  const r=route();const v=$('#view');
  if(mode==='login'){$('#lockBtn').hidden=true;$('#lockRoot').innerHTML='';v.innerHTML='';if(sheetState)closeSheet();drawLogin();return}
  $('#authRoot').innerHTML='';
  if(mode!=='memory'&&!S.lockLoaded&&!connNote){$('#lockBtn').hidden=true;v.innerHTML=`<div class="empty"><b>불러오는 중…</b></div>`;return}
  if(S.lock&&!isUnlocked()){$('#lockBtn').hidden=true;v.innerHTML='';if(sheetState)closeSheet();drawLock();return}
  $('#lockRoot').innerHTML='';$('#lockBtn').hidden=!S.lock;
  if(loadingAll()&&!connNote){v.innerHTML=`<div class="stack">${banners()}<div class="empty"><b>기록을 불러오는 중…</b><br>두 분이 함께 보는 공유 장부에 연결하고 있습니다.</div></div>`;return}
  const views={summary:vSummary,add:vAdd,list:vList,items:vItems,events:vEvents,parents:vParents,assets:vAssets,prefs:vPrefs,more:vMore};
  v.innerHTML=views[r]();
  if(r==='add')bindAdd();if(r==='list')bindList();if(r==='prefs')bindPrefs();
  bindCommon(v);
}
function bindCommon(v){
  v.querySelectorAll('[data-edit-tx]').forEach(el=>{const go=()=>{const t=S.tx.find(x=>x.id===el.dataset.editTx);t&&openTx(t)};el.onclick=go;el.onkeydown=e=>{if(e.key==='Enter')go()}});
  v.querySelectorAll('[data-override]').forEach(el=>{const go=()=>{const f=S.fixed.find(x=>x.id===el.dataset.override);if(!f)return;
    openTx({type:f.type,cat:f.cat,item:f.name,amount:f.amount,user:f.user,share:f.share||'shared',method:f.method,event:'일상',date:dayDate(curM,f.day)||defDate(curM),link:f.group,nature:'고정',memo:'이번 달만 금액 변경'})};el.onclick=go;el.onkeydown=e=>{if(e.key==='Enter')go()}});
  v.querySelectorAll('[data-fill]').forEach(el=>{const go=()=>{const it=S.monthly.find(x=>x.id===el.dataset.fill);it&&fillMonthly(it)};el.onclick=go;el.onkeydown=e=>{if(e.key==='Enter')go()}});
  const qv=id=>quickVals[id]||(quickVals[id]={});
  const fmtIn=(inp,cb)=>inp.addEventListener('input',()=>{const d=inp.value.replace(/[^\d]/g,'');inp.value=d?won(+d):'';inp.classList.remove('err');cb(d===''?'':+d)});
  v.querySelectorAll('[data-quick]').forEach(inp=>{fmtIn(inp,d=>qv(inp.dataset.quick).amt=d);inp.addEventListener('keydown',e=>{if(e.key==='Enter')v.querySelector(`[data-quick-save="${inp.dataset.quick}"]`)?.click()})});
  v.querySelectorAll('[data-qb-amt]').forEach(inp=>{fmtIn(inp,d=>qv(inp.dataset.qbAmt).bamt=d);inp.addEventListener('keydown',e=>{if(e.key==='Enter')v.querySelector(`[data-quick-save="${inp.dataset.qbAmt}"]`)?.click()})});
  v.querySelectorAll('[data-qb-cat]').forEach(sel=>sel.onchange=()=>{qv(sel.dataset.qbCat).bcat=sel.value});
  v.querySelectorAll('[data-qb-open]').forEach(b=>b.onclick=()=>{const id=b.dataset.qbOpen;bonusOpen[id]=true;const q=qv(id);q.bcat=q.bcat||(S.settings.cats.bonus||[])[0]||'';render();v.querySelector(`[data-qb-amt="${id}"]`)?.focus()});
  v.querySelectorAll('[data-qb-close]').forEach(b=>b.onclick=()=>{const id=b.dataset.qbClose;bonusOpen[id]=false;delete qv(id).bamt;render()});
  v.querySelectorAll('[data-bonus-add]').forEach(b=>b.onclick=()=>{const it=S.monthly.find(x=>x.id===b.dataset.bonusAdd);const sal=S.tx.find(t=>t.month===curM&&t.link===it.id);
    openTx({type:'수입',cat:(S.settings.cats.bonus||[])[0]||'',user:it.user,date:sal?.date||defDate(curM),with:it.id,method:it.method||'',event:''})});
  v.querySelectorAll('[data-quick-save]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.quickSave;const it=S.monthly.find(x=>x.id===id);const q=qv(id);const inp=v.querySelector(`[data-quick="${id}"]`);
    const typed=String(inp.value).replace(/[^\d]/g,'');if(typed===''){inp.classList.add('err');inp.focus();return}q.amt=+typed;
    const bonus=bonusOpen[id]&&+q.bamt>0?{cat:q.bcat||(S.settings.cats.bonus||[])[0],amt:+q.bamt}:null;
    b.disabled=true;const date=defDate(curM);
    try{await put('tx',newId('tx'),monthlyTx(it,q.amt,date));
      if(bonus)await put('tx',newId('tx'),bonusTx(it,bonus.cat,bonus.amt,date));
      toast(`${it.name} ${won(q.amt)}원${bonus?` · ${bonus.cat} ${won(bonus.amt)}원`:''} 저장했습니다`);
      delete quickVals[id];bonusOpen[id]=false;render();setTimeout(()=>{const n=document.querySelector('#view [data-quick]');n&&n.focus()},40)}catch(e){b.disabled=false}});
  v.querySelectorAll('[data-pint]').forEach(b=>b.onclick=()=>{const m=+b.dataset.pint;const q=parentsMonth(S,m);openParent(null,{kind:'interest',amount:q.expected||'',date:defDate(m)})});
  v.querySelectorAll('[data-fchange]').forEach(b=>b.onclick=()=>openFixedChange(fixedGroups().find(g=>g[0].group===b.dataset.fchange)));
  v.querySelectorAll('[data-fedit]').forEach(b=>b.onclick=()=>openFixed(fixedGroups().find(g=>g[0].group===b.dataset.fedit)));
  v.querySelectorAll('[data-medit]').forEach(b=>b.onclick=()=>openMonthly(S.monthly.find(x=>x.id===b.dataset.medit)));
  v.querySelectorAll('[data-tpl]').forEach(b=>b.onclick=()=>{const[kind,i]=b.dataset.tpl.split(':');const t=TEMPLATES[kind].filter(t=>!(kind==='fixed'?S.fixed:S.monthly).some(x=>x.name===t[0]))[+i];
    if(kind==='fixed'){openFixed(null,{name:t[1]==='할부'?'':t[0],type:t[1],_ptype:t[1],cat:t[2]})}
    else{openMonthly(null);Object.assign(sheetState.vals,{name:t[0],type:t[1],cat:t[2],user:t[3]||me(),nature:'고정'});drawSheet()}});
  v.querySelectorAll('[data-goto="monthly"]').forEach(b=>b.onclick=e=>{e.preventDefault();addModeMem='monthly';lsSet('hb.addmode','monthly');if(location.hash==='#add')render();else location.hash='add'});
  const on=(id,fn)=>{const el=$(id);el&&(el.onclick=fn)};
  v.querySelectorAll('[data-extra]').forEach(b=>b.onclick=()=>openTx({type:'수입',user:b.dataset.extra,date:defDate(curM),event:'',cat:''}));
  on('#consultBtn',openConsult);
  on('#addFixed',()=>openFixed(null));on('#addMonthly',()=>openMonthly(null));
  on('#pAdd',()=>openParent(null));on('#aAdd',()=>openAsset(null));on('#dAdd',()=>openDebt(null));
  on('#evAdd',()=>openTx({type:'지출',event:evSel,date:defDate(curM),user:me(),share:'shared'}));
  on('#pSet',()=>{const ps=S.settings.parents;openSheet({title:'부모님 예치 계산 기준',values:{rate:+(ps.rate*100).toFixed(4),rule:ps.rule||'',person:ps.person},
    fields:[{k:'rate',label:'월 이율 (%)',type:'num',req:true,hint:'1%는 1로 입력합니다. 원금 40,000,000원 × 1% = 월 400,000원.',check:v=>v>=10?'월 이율이 10% 이상입니다. 1%라면 1을 입력하세요.':''},
      {k:'rule',label:'추가 예치 이자 적용',type:'seg',options:[['','미정'],['same','예치한 달부터'],['next','다음 달부터']],full:true},
      {k:'person',label:'담당자',type:'seg',req:true,options:[['A',uname('A')],['B',uname('B')]]}],
    onSave:async x=>{const next=JSON.parse(JSON.stringify(S.settings));next.parents={rate:(+x.rate)/100,rule:x.rule,person:x.person};await saveSettings(next)}})});
  v.querySelectorAll('[data-pedit]').forEach(el=>{const go=()=>openParent(S.parents.find(x=>x.id===el.dataset.pedit));el.onclick=go;el.onkeydown=e=>{if(e.key==='Enter')go()}});
  v.querySelectorAll('[data-aedit]').forEach(el=>{const go=()=>openAsset(S.assets.find(x=>x.id===el.dataset.aedit));el.onclick=go;el.onkeydown=e=>{if(e.key==='Enter')go()}});
  v.querySelectorAll('[data-dedit]').forEach(el=>{const go=()=>openDebt(S.debts.find(x=>x.id===el.dataset.dedit));el.onclick=go;el.onkeydown=e=>{if(e.key==='Enter')go()}});
  v.querySelectorAll('[data-ev]').forEach(b=>b.onclick=()=>{evSel=b.dataset.ev;render()});
  v.querySelectorAll('[data-catx]').forEach(tr=>{const go=()=>{const n=tr.dataset.catx;if(catOpen.has(n))catOpen.delete(n);else catOpen.add(n);keepFocus(render)};tr.onclick=go;tr.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}});
}
function monthlyTx(it,amount,date){return {type:it.type,date,month:ymOf(date),amount,event:'일상',cat:it.cat,item:it.name,user:it.user,share:it.type==='지출'?(it.share||'shared'):'',method:it.method||'',memo:'',link:it.id,nature:it.type==='지출'?(it.nature||'고정'):'',createdAt:new Date().toISOString()}}
function bonusTx(it,cat,amount,date){return {type:'수입',date,month:ymOf(date),amount,event:'일상',cat,item:cat,user:it.user,share:'',method:it.method||'',memo:'',with:it.id,nature:'',createdAt:new Date().toISOString()}}
function fillMonthly(it){openTx({...monthlyTx(it,it.expected||'',defDate(curM)),createdAt:undefined})}

render();boot();
</script>
